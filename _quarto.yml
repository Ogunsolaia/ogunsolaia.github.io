
project:
  type: website
  output-dir: _site
  resources:
    - assets/Isqeel_Ogunsola_CV.pdf

website:
  title: "Isqeel A. Ogunsola"
  site-url: "https://ogunsolaia.github.io"
  description: "Academic website of Isqeel Adesegun Ogunsola"
  favicon: assets/favicon.svg

  navbar:
    title: "Isqeel Ogunsola"
    background: light
    foreground: dark
    pinned: true
    collapse-below: lg

    right:
      - text: Home
        href: index.qmd
      - text: Research
        href: research.qmd
      - text: Publications
        href: publications.qmd
      - text: Software
        href: software.qmd
      - text: Teaching
        href: teaching.qmd
        target: _blank
      - icon: github
        href: https://github.com/Ogunsolaia
        aria-label: GitHub

  page-footer:
    left: "© 2026 Isqeel Adesegun Ogunsola"
    right: "Built with [Quarto](https://quarto.org/) · Hosted on GitHub Pages"

  open-graph: true

format:
  html:
    theme: Flatly
    css: styles.css
    toc: true
    toc-location: right
    link-external-newwindow: true
    smooth-scroll: true
    mainfont: "DM Sans"
    fontsize: 1.05rem

execute:
  freeze: auto
